name: React Project Workflow
on:
  workflow_call:
    inputs:
      # Mandatory inputs
      imageName:
        required: true
        type: string
      githubRef:
        required: true
        type: string
      gitSha:
        required: true
        type: string
      # Optional finetuning inputs
      path:
        required: false
        type: string
        default: .
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      skipReactCheck: # NOTE: Use with CAUTION!
        required: false
        type: boolean
        default: false
      skipReactPublish:
        required: false
        type: boolean
        default: false
      nodeVersion:
        required: false
        type: string
        default: 14
      skipCodecov:
        required: false
        type: boolean
        default: false
      packageManager:
        required: false
        type: string
        description: "Package manager to use"
        default: "yarn"
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
jobs:
  react-check:
    name: React Check
    runs-on: ubuntu-latest
    if: ${{ !inputs.skipReactCheck }}
    steps:
      - uses: actions/checkout@v4

      # pnpm setup
      - name: Install pnpm
        if: ${{ inputs.packageManager == 'pnpm' }}
        uses: pnpm/action-setup@v3
        with:
          version: 8

      # yarn cache
      - name: Cache (yarn)
        uses: actions/cache@v4
        if: ${{ inputs.packageManager == 'yarn' }}
        with:
          path: "**/node_modules"
          key: yarn-${{ hashFiles('${{ inputs.path }}/yarn.lock') }}
      # pnpm cache
      - name: Cache (pnpm)
        uses: actions/cache@v4
        if: ${{ inputs.packageManager == 'pnpm' }}
        with:
          path: |
            ~/.pnpm-store
            ${{ inputs.path }}/node_modules
          key: pnpm-${{ hashFiles('${{ inputs.path }}/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-

      # yarn install dependencies
      - name: Install Dependencies (yarn)
        if: ${{ inputs.packageManager == 'yarn' }}
        run: |-
          cd ${{ inputs.path }}
          yarn install --frozen-lockfile
      # pnpm install dependencies
      - name: Install Dependencies (pnpm)
        if: ${{ inputs.packageManager == 'pnpm' }}
        run: |-
          cd ${{ inputs.path }}
          pnpm install --frozen-lockfile
      - name: Lint
        run: |-
          cd ${{ inputs.path }}
          ${{ inputs.packageManager }} lint
      - name: Test
        run: |-
          cd ${{ inputs.path }}
          ${{ inputs.packageManager }} test
      - name: Upload Code Coverage
        uses: codecov/codecov-action@v4
        if: ${{ !inputs.skipCodecov }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ inputs.path }}
          fail_ci_if_error: true
          name: codecov-umbrella
          verbose: true
    container:
      image: node:${{ inputs.nodeVersion }}
  publish-frontend:
    name: Publish frontend
    runs-on: ubuntu-latest
    needs: react-check
    if: |
      always() &&
      (needs.react-check.result == 'success' || needs.react-check.result == 'skipped') &&
      !inputs.skipReactPublish
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v1
      - uses: docker/setup-buildx-action@v1
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-publish-frontend
      - uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build/Publish
        uses: docker/build-push-action@v2
        with:
          context: ${{ inputs.path }}
          file: ${{ inputs.path }}/${{ inputs.dockerfile }}
          push: ${{ inputs.githubRef == 'master' }}
          cache-from: type=local,src=/tmp/.buildx-cache,type=registry,ref=pennlabs/${{ inputs.imageName }}:latest
          cache-to: type=local,dest=/tmp/.buildx-cache
          tags: pennlabs/${{ inputs.imageName }}:latest,pennlabs/${{ inputs.imageName }}:${{ inputs.gitSha }}
